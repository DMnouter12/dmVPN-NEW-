
name: Build NIVORANT VPN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NIVORANT-VPN-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Check release signing secrets
        id: signing
        env:
          KEY: ${{ secrets.NIVORANT_KEY_BASE64 }}
          PASSWORD: ${{ secrets.NIVORANT_STORE_PASSWORD }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release signing key
        if: steps.signing.outputs.available == 'true'
        env:
          KEY: ${{ secrets.NIVORANT_KEY_BASE64 }}
        run: |
          printf '%s' "$KEY" | tr -d '[:space:]' | base64 --decode > app/nivorant-upload.jks
          test -s app/nivorant-upload.jks

      - name: Build Release APK
        if: steps.signing.outputs.available == 'true'
        env:
          NIVORANT_STORE_PASSWORD: ${{ secrets.NIVORANT_STORE_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NIVORANT-VPN-Release
          path: app/build/outputs/apk/release/*.apk

      - name: Remove signing key
        if: always()
        run: rm -f app/nivorant-upload.jks
