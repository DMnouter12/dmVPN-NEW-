
name: Build NIVORANT VPN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          NIVORANT_KEY_BASE64: ${{ secrets.NIVORANT_KEY_BASE64 }}
        run: |
          test -n "$NIVORANT_KEY_BASE64"
          printf '%s' "$NIVORANT_KEY_BASE64" | base64 --decode > app/nivorant-upload.jks

      - name: Build APKs
        env:
          NIVORANT_STORE_PASSWORD: ${{ secrets.NIVORANT_STORE_PASSWORD }}
        run: gradle assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NIVORANT-VPN-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NIVORANT-VPN-Release
          path: app/build/outputs/apk/release/*.apk

      - name: Remove signing key
        if: always()
        run: rm -f app/nivorant-upload.jks
